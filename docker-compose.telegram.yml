# No web dashboard, no local UI, no listening public ports.
# Run on a remote always-on VPS: docker compose -f docker-compose.telegram.yml up --build -d
name: pulse-telegram
services:
  pulse:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["sh", "-ec", "python -m alembic upgrade head && exec python -m app.telegram_runtime"]
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./backend/.env
    environment:
      BOT_ONLY: "true"
      MINI_APP_URL: ""
      STORAGE_DIR: /data
    volumes:
      - pulse_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; from app.db import engine; from sqlalchemy import text; assert time.time()-Path('/data/runtime-heartbeat').stat().st_mtime<90; c=engine.connect(); c.execute(text('select 1')); c.close()"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
  # OPTIONAL: run only for Instagram/TikTok OAuth or hosted approved media.
  # Secure HTTPS reverse proxy must be configured separately. No admin UI.
  oauth-bridge:
    profiles: ["social-oauth"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["uvicorn", "app.oauth_bridge:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      pulse:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      BOT_ONLY: "true"
      STORAGE_DIR: /data
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - pulse_data:/data

volumes:
  pulse_data:
